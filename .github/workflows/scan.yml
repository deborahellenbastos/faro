name: Robô Faro

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos (o GitHub às vezes atrasa alguns minutos)
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: robo-faro
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUTO_BUY: ${{ vars.AUTO_BUY }}
      SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      FARO_SENHA: ${{ secrets.FARO_SENHA }}
      FARO_WALLET: ${{ secrets.FARO_WALLET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar bibliotecas de compra (só se a compra estiver ligada)
        if: ${{ vars.AUTO_BUY == 'true' }}
        run: npm install --no-save --no-audit --no-fund @solana/web3.js@1 bs58@6

      - name: Rodar o robô
        run: node scanner/index.mjs

      - name: Salvar resultado no painel
        run: |
          git config user.name "robo-faro"
          git config user.email "robo-faro@users.noreply.github.com"
          git add -A docs/data.json docs/data.enc.json 2>/dev/null || git add -A docs
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza painel [skip ci]"
          git pull --rebase -X theirs origin ${{ github.ref_name }} || true
          git push
