name: Robô Faro

on:
  schedule:
    - cron: '*/10 * * * *'   # o GitHub atrasa e pula horários; por isso cada execução roda em sequência por ~55 min
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  actions: write   # para o robô chamar a própria próxima execução

# Só uma execução por vez. A próxima fica na fila e assume quando a atual termina: o robô nunca fica parado.
concurrency:
  group: robo-faro
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AUTO_BUY: ${{ vars.AUTO_BUY }}
      AUTO_SELL: ${{ vars.AUTO_SELL }}
      SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      FARO_SENHA: ${{ secrets.FARO_SENHA }}
      FARO_WALLET: ${{ secrets.FARO_WALLET }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar bibliotecas de compra/venda (só se alguma estiver ligada)
        if: ${{ vars.AUTO_BUY == 'true' || vars.AUTO_SELL == 'true' }}
        run: npm install --no-save --no-audit --no-fund @solana/web3.js@1 bs58@6

      - name: Rodar o robô a cada 5 minutos, por ~55 minutos
        run: |
          git config user.name "robo-faro"
          git config user.email "robo-faro@users.noreply.github.com"
          MSG="Atualiza painel [skip ci]"

          salvar() {
            # Guarda o resultado, alinha com o que está no GitHub (pega código novo, se houver) e grava por cima
            rm -rf /tmp/faro-out && mkdir -p /tmp/faro-out
            cp docs/data.enc.json docs/data.json /tmp/faro-out/ 2>/dev/null || true
            git fetch -q origin "$BRANCH" || return 0
            git reset -q --hard "origin/$BRANCH"
            if [ -f /tmp/faro-out/data.enc.json ]; then
              cp /tmp/faro-out/data.enc.json docs/ && rm -f docs/data.json
            elif [ -f /tmp/faro-out/data.json ]; then
              cp /tmp/faro-out/data.json docs/
            fi
            git add -A docs/data.json docs/data.enc.json 2>/dev/null || git add -A docs
            git diff --cached --quiet && return 0
            # Se a última gravação já é do robô, sobrescreve em vez de empilhar (o histórico não cresce)
            if [ "$(git log -1 --format=%s)" = "$MSG" ] && [ "$(git rev-list --count HEAD)" -gt 1 ]; then
              git commit -q --amend --no-edit --date=now
              git push -q --force-with-lease origin "HEAD:$BRANCH" || echo "Não gravou nesta rodada; tenta na próxima"
            else
              git commit -q -m "$MSG"
              git push -q origin "HEAD:$BRANCH" || echo "Não gravou nesta rodada; tenta na próxima"
            fi
          }

          FIM=$(( $(date +%s) + 3300 ))
          while :; do
            INICIO=$(date +%s)
            node scanner/index.mjs || echo "Rodada com erro; segue para a próxima"
            salvar
            AGORA=$(date +%s)
            [ $(( INICIO + 300 )) -ge "$FIM" ] && break
            ESPERA=$(( 300 - (AGORA - INICIO) ))
            [ "$ESPERA" -gt 0 ] && sleep "$ESPERA"
          done

      # O agendador do GitHub falha com frequência. Ao terminar, o robô agenda a própria continuação;
      # o agendamento acima fica só como reserva, caso a corrente se quebre.
      - name: Chamar a próxima execução
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --ref "$BRANCH" || echo "Não consegui chamar a próxima; o agendamento reserva assume"
